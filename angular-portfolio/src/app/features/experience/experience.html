<section
  id="experience"
  class="py-20 bg-gray-950 text-white px-6"
>
  <div class="max-w-5xl mx-auto">

    <!-- Title -->
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-16 animate-fade-in">
      Experience
    </h2>

    <!-- Timeline -->
    <div class="relative border-l border-gray-700">

      <!-- Item -->
      <div
        *ngFor="let exp of experiences; let i = index"
        class="mb-12 ml-6 animate-fade-in"
      >

        <!-- Dot -->
        <span
          class="absolute -left-3 flex items-center justify-center w-6 h-6 bg-blue-600 rounded-full ring-8 ring-gray-950"
        ></span>

        <!-- Card -->
        <div class="bg-gray-900 p-6 rounded-xl shadow-lg hover:shadow-xl transition">

          <h3 class="text-xl font-semibold">
            {{ exp.role }}
          </h3>

          <p class="text-blue-400 text-sm mb-2">
            {{ exp.company }}
          </p>

          <p class="text-gray-500 text-sm mb-4">
            {{ exp.duration }}
          </p>

          <ul class="list-disc list-inside space-y-2 text-gray-400 text-sm">
            <li *ngFor="let point of exp.description">
              {{ point }}
            </li>
          </ul>

        </div>

      </div>

    </div>

  </div>
</section>
