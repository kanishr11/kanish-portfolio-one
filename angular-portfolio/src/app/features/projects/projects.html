<section
  id="projects"
  class="py-20 bg-gray-900 text-white px-6"
>
  <div class="max-w-6xl mx-auto">

    <!-- Title -->
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 animate-fade-in">
      Projects
    </h2>

    <!-- Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">

      <!-- Card -->
      <div
        *ngFor="let project of projects"
        class="animate-fade-in bg-gray-800 rounded-2xl p-6 shadow-lg hover:shadow-xl transition transform hover:-translate-y-2 flex flex-col justify-between"
      >

        <!-- Content -->
        <div>
          <h3 class="text-xl font-semibold mb-3">
            {{ project.title }}
          </h3>

          <p class="text-gray-400 mb-4 text-sm leading-relaxed">
            {{ project.description }}
          </p>

          <!-- Tech Stack -->
          <div class="flex flex-wrap gap-2 mb-4">
            <span
              *ngFor="let tech of project.tech"
              class="text-xs bg-gray-700 px-3 py-1 rounded-full text-gray-300"
            >
              {{ tech }}
            </span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-4 mt-4">

          <a
            [href]="project.github"
            target="_blank"
            class="flex-1 text-center px-4 py-2 border border-gray-600 rounded-lg hover:border-white transition text-sm"
          >
            GitHub
          </a>

          <a
            [href]="project.live"
            target="_blank"
            class="flex-1 text-center px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition text-sm"
          >
            Live Demo
          </a>

        </div>

      </div>

    </div>

  </div>
</section>
