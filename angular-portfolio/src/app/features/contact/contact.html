<section
  id="contact"
  class="py-20 bg-gray-900 text-white px-6"
>
  <div class="max-w-4xl mx-auto">

    <!-- Title -->
    <h2 class="text-3xl md:text-4xl font-bold text-center mb-12 animate-fade-in">
      Contact Me
    </h2>

    <!-- Form -->
    <form
      [formGroup]="contactForm"
      (ngSubmit)="onSubmit()"
      class="bg-gray-800 p-8 rounded-2xl shadow-lg space-y-6 animate-fade-in"
    >

      <!-- Name -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">Name</label>
        <input
          type="text"
          formControlName="name"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500"
        />

        <p *ngIf="submitted && f['name'].errors" class="text-red-400 text-sm mt-1">
          Name must be at least 3 characters
        </p>
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500"
        />

        <p *ngIf="submitted && f['email'].errors" class="text-red-400 text-sm mt-1">
          Enter a valid email address
        </p>
      </div>

      <!-- Message -->
      <div>
        <label class="block mb-2 text-sm text-gray-300">Message</label>
        <textarea
          rows="5"
          formControlName="message"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500"
        ></textarea>

        <p *ngIf="submitted && f['message'].errors" class="text-red-400 text-sm mt-1">
          Message must be at least 10 characters
        </p>
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 transition rounded-lg font-medium"
      >
        Send Message
      </button>

    </form>

  </div>
</section>
