<section id="skills" class="py-20 sm:py-24">
  <div class="section-shell">
    <div class="mb-10 max-w-2xl">
      <span class="section-tag">Skills</span>
      <h2 class="section-heading mt-5">Technology architecture across product, API, and data layers.</h2>
    </div>

    <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      @for (group of skillGroups; track group.category) {
        <div class="glass-card p-6 transition duration-300 hover:border-blue-500/40 hover:-translate-y-1">
          <h3 class="mb-4 text-xs uppercase tracking-[0.2em] text-blue-200">{{ group.category }}</h3>
          <div class="flex flex-wrap gap-2">
            @for (item of group.items; track item) {
              <span class="tech-pill">{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
